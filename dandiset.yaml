description: This is the functional imaging of the V1 Deep Dive functional connectomics
  dataset. It consists of visual responses of neurons in the primary visual cortex
  (V1/VISp) of a mouse that was subsequently used for EM imaging and reconstruction.
  The functional and connectomic data has been co-registered. This dataset contains
  dense calcium imaging of excitatory neurons at the center of mouse V1. A Slc17a7-IRES2-Cre;Camk2a-tTA;Ai94
  (GCaMP6s) mouse was imagined using both 2-photon and 3-photon imaging. Five columns
  were imaged, column 1 in the center and columns 2-5 at each of the four corners.
  For each column, five volumes were imaged using multi-plane 2-photon imaging. Six
  planes, separated by 16 um, were imaged per volume. These stacked volumes thus span
  from ~50 um to ~550 um below the surface. The central column was further imaged
  using single-plane 3-photon imaged at 25 um steps down to ~725um. During imaging,
  the awake mouse was head-fixed on a running disc and presented with a variety of
  visual stimuli including full-field and windowed drifting gratings, natural scenes,
  and natural movies.
